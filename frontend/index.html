<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Shopping in Pakistan: Fashion, Electronics &amp; Groceries - Daraz.pk</title>
  <link rel="icon" type="image/ico" href="Images/mainLogo.ico" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/messages.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="banner">
    <div class="banner__slider">
      <div class="banner__track" id="slides-container"></div>
      <div class="banner__nav banner__nav--prev"></div>
      <div class="banner__nav banner__nav--next"></div>
      <div class="banner__pagination"></div>
    </div>
    <div class="app-promo">
      <div class="app-promo__header">
        <div class="app-promo__logo">
          <img src="Images/promo-logo.jpg" alt="Daraz App Promo" />
        </div>
        <span class="app-promo__title">TRY DARAZ APP</span>
      </div>
      <div class="app-promo__content">
        <div class="app-promo__rating">
          <img src="Images/star.avif" alt="Star" />
          <span>4.8 Rated</span>
        </div>
        <div class="app-promo__desc">
          <p class="app-text">Download the App now</p>
        </div>
        <div class="app-promo__features">
          <div class="app-promo__feature">
            <img src="Images/car.avif" alt="Free Shipping" />
            <span>Free Shipping</span>
          </div>
          <div class="app-promo__feature">
            <img src="Images/voucher.avif" alt="Exclusive Vouchers" />
            <span>Exclusive Vouchers</span>
          </div>
        </div>
      </div>
      <div class="app-promo__download-section">
        <img src="Images/qrcode.avif" alt="QR Code" class="app-promo__qr" />
        <div class="app-promo__stores">
          <a href="#" class="app-promo__stores-btn app-promo__btn-apple"></a>
          <a href="#" class="app-promo__stores-btn app-promo__btn-google"></a>
        </div>
      </div>
      <p class="app-promo__note">Download the App Now!</p>
    </div>
  </div>

  <div class="u-image-wrapper c-promo-banner">
    <img src="Images/EidSale.webp" alt="Eid Sale" />
  </div>

  <div id="home-main-content">
    <!-- Dynamic Sections injected here -->
  </div>

  <div class="load-more-container">
    <div class="c-btn c-btn--cyan c-btn--lg load-more-btn">Load More</div>
    <div class="jfy-load-indicator" aria-hidden="true">
      <div class="jfy-load-indicator__spinner"></div>
    </div>
    <div class="jfy-load-end-message" aria-live="polite">You have reached the end of the products.</div>
  </div>

  <!--  SHARED FOOTER — with SEO section (index only) -->
  <div id="footer-placeholder" data-seo="true"></div>

  <div class="c-lift-nav">
    <div class="c-lift-nav__item">
      <i class="lazada-icon">&#xe735;</i>
    </div>
    <div class="c-lift-nav__item">
      <i class="lazada-icon">&#xe708;</i>
      <span class="c-lift-nav__hover-text">Flash Sale</span>
    </div>
    <div class="c-lift-nav__item">
      <i class="lazada-icon">&#xe6fd;</i>
      <span class="c-lift-nav__hover-text">Categories</span>
    </div>
    <div class="c-lift-nav__item">
      <i class="lazada-icon c-lift-nav__icon--accent">&#xe61a;</i>
      <span class="c-lift-nav__hover-text">Just For You</span>
    </div>
  </div>

  <!-- Chat Widget -->
  <div tabindex="0" class="chat-widget chat-widget--minimized">
    <button class="chat-widget__btn">
      <div class="chat-widget__content">
        <img src="Images/messages-icon.svg" class="chat-widget__icon" alt="Messages" />
        <div class="chat-widget__title">Messages</div>
      </div>
    </button>
  </div>

  <!-- External Libraries -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Entry Points (Modules) -->
  <script type="module" src="js/core/layout.js"></script>
  <script type="module" src="js/core/login-modal.js"></script>
  <script type="module" src="js/core/signup-modal.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
